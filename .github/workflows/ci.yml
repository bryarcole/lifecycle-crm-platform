name: Validate application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: Install API dependencies
        run: npm ci
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Run lifecycle tests
        run: npm test
      - name: Type-check services and data generator
        run: |
          npm run check
          npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --strict --esModuleInterop --skipLibCheck scripts/seed-customers.ts
      - name: Build frontend
        run: npm run build:web
