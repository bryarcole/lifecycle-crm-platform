name: lifecycle-crm
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifecycle_crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_only_change_me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  crm-api:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT: src/Lifecycle.Api/Lifecycle.Api.csproj
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Crm: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lifecycle_crm};Username=${POSTGRES_USER:-crm_app};Password=${POSTGRES_PASSWORD:-local_only_change_me}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    restart: unless-stopped

  automation-worker:
    build:
      context: .
      dockerfile: Dockerfile.dotnet
      args:
        PROJECT: src/Lifecycle.Worker/Lifecycle.Worker.csproj
    command: ["dotnet", "Lifecycle.Worker.dll"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Crm: Host=postgres;Port=5432;Database=${POSTGRES_DB:-lifecycle_crm};Username=${POSTGRES_USER:-crm_app};Password=${POSTGRES_PASSWORD:-local_only_change_me}
    depends_on:
      crm-api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      crm-api: { condition: service_started }
    environment:
      CRM_API_HOST: crm-api:8080
    ports:
      - "${WEB_PORT:-3000}:80"
    restart: unless-stopped

volumes:
  postgres-data:
